name: Procesar Agenda Deportiva

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ejecutar script procesar_agenda.py
        run: python procesar_agenda.py

      # Paso de diagnóstico para ver qué archivos existen
      - name: Listar archivos generados
        run: ls -la

      - name: Commit y Push de los cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Verificar si el archivo existe antes de agregarlo
          if [ -f "agenda.json" ]; then
            git add agenda.json
            if git diff --staged --quiet; then
              echo "No hay cambios nuevos en agenda.json para guardar."
            else
              git commit -m "Actualización automática de agenda.json [skip ci]"
              git push
            fi
          else
            echo "El archivo agenda.json no fue generado por el script."
            exit 1
          fi
